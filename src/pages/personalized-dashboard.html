<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Personalized Dashboard - Permahub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Platform CSS -->
    <link rel="stylesheet" href="../css/main-platform/variables.css">
    <link rel="stylesheet" href="../css/main-platform/base.css">
    <link rel="stylesheet" href="../css/main-platform/layout.css">

    <!-- Component CSS -->
    <link rel="stylesheet" href="../css/main-platform/components/dashboard-greeting.css">
    <link rel="stylesheet" href="../css/main-platform/components/dashboard-quick-actions.css">
    <link rel="stylesheet" href="../css/main-platform/components/dashboard-widgets.css">
    <link rel="stylesheet" href="../css/main-platform/components/dashboard-insights.css">
    <link rel="stylesheet" href="../css/main-platform/components/dashboard-customization.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="../css/main-platform/pages/personalized-dashboard.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="greeting">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="greeting-text">
                    <h1 id="greetingText">Welcome back!</h1>
                    <div class="subtitle" id="lastSeen">Loading your personalized dashboard...</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="toggleCustomization()">
                    <i class="fas fa-sliders-h"></i>
                    Customize
                </button>
                <button class="header-btn" onclick="refreshDashboard()">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
                <button class="header-btn" onclick="viewProfile()">
                    <i class="fas fa-user-circle"></i>
                    Profile
                </button>
            </div>
        </div>
    </header>

    <!-- Insights Panel -->
    <div class="dashboard-container">
        <div class="insights-panel" id="insightsPanel">
            <h2 class="insights-title">
                <i class="fas fa-chart-line"></i>
                Your Permahub Journey
            </h2>
            <div class="insight-cards">
                <div class="insight-card">
                    <div class="insight-value" id="totalInteractions">0</div>
                    <div class="insight-label">Total Interactions</div>
                    <div class="insight-trend trend-up">
                        <i class="fas fa-arrow-up"></i>
                        <span>+12% this week</span>
                    </div>
                </div>
                <div class="insight-card">
                    <div class="insight-value" id="favoriteCategory">-</div>
                    <div class="insight-label">Top Interest</div>
                    <div class="insight-trend">
                        <span id="categoryEngagement">High engagement</span>
                    </div>
                </div>
                <div class="insight-card">
                    <div class="insight-value" id="projectsViewed">0</div>
                    <div class="insight-label">Projects Explored</div>
                    <div class="insight-trend trend-up">
                        <i class="fas fa-arrow-up"></i>
                        <span>+5 this month</span>
                    </div>
                </div>
                <div class="insight-card">
                    <div class="insight-value" id="communityRank">-</div>
                    <div class="insight-label">Community Activity</div>
                    <div class="insight-trend">
                        <span>Active contributor</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <h3 class="quick-actions-title">Quick Actions</h3>
            <div class="action-buttons">
                <button class="action-btn" onclick="window.location.href='add-item.html'">
                    <i class="fas fa-plus-circle"></i>
                    Add Project
                </button>
                <button class="action-btn" onclick="window.location.href='resources.html'">
                    <i class="fas fa-search"></i>
                    Find Resources
                </button>
                <button class="action-btn" onclick="window.location.href='map.html'">
                    <i class="fas fa-map-marked-alt"></i>
                    Explore Map
                </button>
                <button class="action-btn" onclick="window.location.href='wiki.html'">
                    <i class="fas fa-book"></i>
                    Browse Wiki
                </button>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid" id="dashboardGrid">
            <!-- Loading skeletons -->
            <div class="widget-card skeleton loading-widget"></div>
            <div class="widget-card skeleton loading-widget"></div>
            <div class="widget-card skeleton loading-widget"></div>
        </div>
    </div>

    <!-- Customization Panel -->
    <div class="customization-panel" id="customizationPanel">
        <div class="customization-header">
            <h3>Customize Dashboard</h3>
            <button onclick="toggleCustomization()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="customization-content">
            <div class="customization-section">
                <div class="customization-section-title">Widget Visibility</div>
                <div id="widgetToggles">
                    <!-- Widget toggles will be populated here -->
                </div>
            </div>
            <div class="customization-section">
                <div class="customization-section-title">Layout Density</div>
                <select id="densitySelect" onchange="updateDensity(this.value)" style="width: 100%; padding: 8px; border: 1px solid var(--gray-300); border-radius: 6px;">
                    <option value="compact">Compact</option>
                    <option value="normal" selected>Normal</option>
                    <option value="comfortable">Comfortable</option>
                </select>
            </div>
            <div class="customization-section">
                <div class="customization-section-title">Theme</div>
                <select id="themeSelect" onchange="updateTheme(this.value)" style="width: 100%; padding: 8px; border: 1px solid var(--gray-300); border-radius: 6px;">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="system">System</option>
                </select>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Initialize Supabase
        const supabaseUrl = 'https://mcbxbaggjaxqfdvmrqsc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jYnhiYWdnamF4cWZkdm1ycXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzA3NTQxMDEsImV4cCI6MjA0NjMzMDEwMX0.qxXxJT0U7t6WmMiONirmHnBZBUhYwG5q3jF2Swtu4NI';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // Global variables
        let currentUser = null;
        let userPreferences = {};
        let dashboardConfig = {};
        let userActivity = [];
        let affinityScores = [];

        // Widget definitions
        const widgetDefinitions = {
            favorite_categories: {
                title: 'Your Top Interests',
                icon: 'fa-star',
                render: renderFavoriteCategories
            },
            recent_activity: {
                title: 'Recent Activity',
                icon: 'fa-clock',
                render: renderRecentActivity
            },
            recommendations: {
                title: 'Recommended for You',
                icon: 'fa-lightbulb',
                render: renderRecommendations
            },
            nearby_projects: {
                title: 'Projects Near You',
                icon: 'fa-map-marker-alt',
                render: renderNearbyProjects
            },
            trending_resources: {
                title: 'Trending Resources',
                icon: 'fa-fire',
                render: renderTrendingResources
            },
            wiki_suggestions: {
                title: 'Learn Something New',
                icon: 'fa-graduation-cap',
                render: renderWikiSuggestions
            }
        };

        // Initialize dashboard
        async function initDashboard() {
            try {
                // Get current user
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = 'auth.html';
                    return;
                }
                currentUser = user;

                // Update greeting
                await updateGreeting();

                // Load user preferences and config
                await loadUserPreferences();

                // Track page view
                await trackActivity('view', 'dashboard', null);

                // Load dashboard widgets
                await loadDashboardWidgets();

                // Load insights
                await loadInsights();

            } catch (error) {
                console.error('Error initializing dashboard:', error);
            }
        }

        // Update greeting based on user and time
        async function updateGreeting() {
            const { data: profile } = await supabase
                .from('users')
                .select('full_name, last_login')
                .eq('id', currentUser.id)
                .single();

            const hour = new Date().getHours();
            let greeting = 'Welcome back';
            if (hour < 12) greeting = 'Good morning';
            else if (hour < 18) greeting = 'Good afternoon';
            else greeting = 'Good evening';

            const name = profile?.full_name?.split(' ')[0] || 'there';
            document.getElementById('greetingText').textContent = `${greeting}, ${name}!`;

            // Update avatar
            const initial = name[0].toUpperCase();
            document.getElementById('userAvatar').textContent = initial;

            // Update last seen
            if (profile?.last_login) {
                const lastLogin = new Date(profile.last_login);
                const timeAgo = getTimeAgo(lastLogin);
                document.getElementById('lastSeen').textContent = `Last active ${timeAgo}`;
            }
        }

        // Load user preferences and dashboard config
        async function loadUserPreferences() {
            // Load affinity scores
            const { data: scores } = await supabase
                .from('user_affinity_scores')
                .select('*, resource_categories(*)')
                .eq('user_id', currentUser.id)
                .order('overall_score', { ascending: false });

            affinityScores = scores || [];

            // Load dashboard config
            const { data: config } = await supabase
                .from('user_dashboard_config')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();

            if (config) {
                dashboardConfig = config;
            } else {
                // Create default config
                await createDefaultDashboardConfig();
            }

            // Load recent activity
            const { data: activity } = await supabase
                .from('user_activity')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false })
                .limit(20);

            userActivity = activity || [];
        }

        // Create default dashboard configuration
        async function createDefaultDashboardConfig() {
            const defaultConfig = {
                user_id: currentUser.id,
                layout_type: 'auto',
                theme_preference: 'system',
                widgets: {
                    favorite_categories: { visible: true, order: 1, expanded: true },
                    recent_activity: { visible: true, order: 2, expanded: true },
                    recommendations: { visible: true, order: 3, expanded: true },
                    nearby_projects: { visible: true, order: 4, expanded: false },
                    trending_resources: { visible: true, order: 5, expanded: false },
                    wiki_suggestions: { visible: true, order: 6, expanded: false }
                },
                show_recommendations: true,
                recommendation_count: 10,
                content_density: 'normal'
            };

            const { data, error } = await supabase
                .from('user_dashboard_config')
                .insert(defaultConfig)
                .select()
                .single();

            dashboardConfig = data || defaultConfig;
        }

        // Load and render dashboard widgets
        async function loadDashboardWidgets() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = ''; // Clear loading skeletons

            // Sort widgets by order
            const sortedWidgets = Object.entries(dashboardConfig.widgets || {})
                .filter(([key, config]) => config.visible)
                .sort((a, b) => a[1].order - b[1].order);

            // Render each widget
            for (const [widgetKey, config] of sortedWidgets) {
                const definition = widgetDefinitions[widgetKey];
                if (definition) {
                    const widgetElement = await createWidget(widgetKey, definition, config);
                    grid.appendChild(widgetElement);
                }
            }

            // Populate customization panel
            populateCustomizationPanel();
        }

        // Create a widget element
        async function createWidget(key, definition, config) {
            const widget = document.createElement('div');
            widget.className = 'widget-card';
            widget.dataset.widgetKey = key;

            widget.innerHTML = `
                <div class="widget-header">
                    <h3 class="widget-title">
                        <i class="fas ${definition.icon}"></i>
                        ${definition.title}
                    </h3>
                    <div class="widget-actions">
                        <button class="widget-action" onclick="refreshWidget('${key}')" title="Refresh">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button class="widget-action" onclick="toggleWidget('${key}')" title="Collapse">
                            <i class="fas fa-chevron-${config.expanded ? 'up' : 'down'}"></i>
                        </button>
                    </div>
                </div>
                <div class="widget-content" id="widget-content-${key}" ${!config.expanded ? 'style="display: none;"' : ''}>
                    <div class="skeleton" style="height: 100px;"></div>
                </div>
            `;

            // Render widget content
            setTimeout(() => definition.render(key), 100);

            return widget;
        }

        // Widget render functions
        async function renderFavoriteCategories(widgetKey) {
            const container = document.getElementById(`widget-content-${widgetKey}`);

            if (affinityScores.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-seedling"></i>
                        <div class="empty-state-title">No interests yet</div>
                        <div class="empty-state-text">Start exploring to build your interest profile</div>
                    </div>
                `;
                return;
            }

            const topCategories = affinityScores.slice(0, 6);
            const html = `
                <div class="category-grid">
                    ${topCategories.map(score => `
                        <div class="category-item" onclick="exploreCategory('${score.category_id}')">
                            <div class="category-score">${Math.round(score.overall_score * 100)}%</div>
                            <div class="category-emoji">${score.resource_categories?.icon_emoji || '📦'}</div>
                            <div class="category-name">${score.resource_categories?.name || 'Unknown'}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        async function renderRecentActivity(widgetKey) {
            const container = document.getElementById(`widget-content-${widgetKey}`);

            if (userActivity.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <div class="empty-state-title">No recent activity</div>
                        <div class="empty-state-text">Your activity will appear here</div>
                    </div>
                `;
                return;
            }

            const recentItems = userActivity.slice(0, 5);
            const html = `
                <div class="activity-feed">
                    ${recentItems.map(activity => {
                        const icon = getActivityIcon(activity.activity_type);
                        const text = getActivityText(activity);
                        const time = getTimeAgo(new Date(activity.created_at));
                        return `
                            <div class="activity-item">
                                <div class="activity-icon">
                                    <i class="fas ${icon}"></i>
                                </div>
                                <div class="activity-text">${text}</div>
                                <div class="activity-time">${time}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        async function renderRecommendations(widgetKey) {
            const container = document.getElementById(`widget-content-${widgetKey}`);

            try {
                // Get personalized recommendations
                const { data: recommendations } = await supabase
                    .rpc('get_personalized_content', {
                        p_user_id: currentUser.id,
                        p_limit: 5
                    });

                if (!recommendations || recommendations.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-compass"></i>
                            <div class="empty-state-title">Building recommendations</div>
                            <div class="empty-state-text">Explore more to get personalized suggestions</div>
                        </div>
                    `;
                    return;
                }

                const html = `
                    <div class="content-list">
                        ${recommendations.map(item => `
                            <div class="content-item" onclick="viewContent('${item.content_type}', '${item.content_id}')">
                                <div class="content-icon">
                                    <i class="fas ${getContentIcon(item.content_type)}"></i>
                                </div>
                                <div class="content-details">
                                    <div class="content-title">${item.title}</div>
                                    <div class="content-meta">
                                        <span class="content-badge">${item.category_name || item.content_type}</span>
                                        <span>${item.reason}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading recommendations:', error);
                container.innerHTML = '<p>Error loading recommendations</p>';
            }
        }

        async function renderNearbyProjects(widgetKey) {
            const container = document.getElementById(`widget-content-${widgetKey}`);

            try {
                // Get user location
                const { data: userProfile } = await supabase
                    .from('users')
                    .select('latitude, longitude')
                    .eq('id', currentUser.id)
                    .single();

                if (!userProfile?.latitude || !userProfile?.longitude) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-map-pin"></i>
                            <div class="empty-state-title">Location not set</div>
                            <div class="empty-state-text">Update your profile to see nearby projects</div>
                        </div>
                    `;
                    return;
                }

                // Get nearby projects
                const { data: projects } = await supabase
                    .from('projects')
                    .select('*')
                    .eq('is_active', true)
                    .limit(5);

                if (!projects || projects.length === 0) {
                    container.innerHTML = '<p>No nearby projects found</p>';
                    return;
                }

                const html = `
                    <div class="content-list">
                        ${projects.map(project => `
                            <div class="content-item" onclick="viewProject('${project.id}')">
                                <div class="content-icon">
                                    <i class="fas fa-leaf"></i>
                                </div>
                                <div class="content-details">
                                    <div class="content-title">${project.name}</div>
                                    <div class="content-meta">
                                        <span><i class="fas fa-map-marker-alt"></i> ${project.location || 'Unknown'}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading nearby projects:', error);
                container.innerHTML = '<p>Error loading projects</p>';
            }
        }

        async function renderTrendingResources(widgetKey) {
            const container = document.getElementById(`widget-content-${widgetKey}`);

            try {
                // Get trending resources (most viewed in last 7 days)
                const { data: resources } = await supabase
                    .from('resources')
                    .select('*, resource_categories(name, icon_emoji)')
                    .eq('is_available', true)
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (!resources || resources.length === 0) {
                    container.innerHTML = '<p>No trending resources</p>';
                    return;
                }

                const html = `
                    <div class="content-list">
                        ${resources.map(resource => `
                            <div class="content-item" onclick="viewResource('${resource.id}')">
                                <div class="content-icon">
                                    ${resource.resource_categories?.icon_emoji || '📦'}
                                </div>
                                <div class="content-details">
                                    <div class="content-title">${resource.title}</div>
                                    <div class="content-meta">
                                        <span class="content-badge">${resource.resource_categories?.name || resource.resource_type}</span>
                                        ${resource.price ? `<span>$${resource.price}</span>` : '<span>Free</span>'}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading trending resources:', error);
                container.innerHTML = '<p>Error loading resources</p>';
            }
        }

        async function renderWikiSuggestions(widgetKey) {
            const container = document.getElementById(`widget-content-${widgetKey}`);

            try {
                // Get wiki guides based on user interests
                const { data: guides } = await supabase
                    .from('wiki_guides')
                    .select('*, wiki_guide_categories(wiki_categories(name, icon))')
                    .eq('status', 'published')
                    .order('view_count', { ascending: false })
                    .limit(5);

                if (!guides || guides.length === 0) {
                    container.innerHTML = '<p>No wiki guides available</p>';
                    return;
                }

                const html = `
                    <div class="content-list">
                        ${guides.map(guide => `
                            <div class="content-item" onclick="viewWikiGuide('${guide.slug}')">
                                <div class="content-icon">
                                    <i class="fas fa-book-open"></i>
                                </div>
                                <div class="content-details">
                                    <div class="content-title">${guide.title}</div>
                                    <div class="content-meta">
                                        <span><i class="fas fa-eye"></i> ${guide.view_count} views</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading wiki suggestions:', error);
                container.innerHTML = '<p>Error loading guides</p>';
            }
        }

        // Load insights panel
        async function loadInsights() {
            // Total interactions
            document.getElementById('totalInteractions').textContent = userActivity.length;

            // Favorite category
            if (affinityScores.length > 0) {
                const topCategory = affinityScores[0];
                document.getElementById('favoriteCategory').textContent =
                    topCategory.resource_categories?.icon_emoji || '🌱';
                document.getElementById('categoryEngagement').textContent =
                    `${Math.round(topCategory.overall_score * 100)}% engagement`;
            }

            // Projects viewed
            const projectViews = userActivity.filter(a =>
                a.content_type === 'project' && a.activity_type === 'view'
            ).length;
            document.getElementById('projectsViewed').textContent = projectViews;

            // Community rank (simplified)
            const activityLevel = userActivity.length > 50 ? 'Very Active' :
                                 userActivity.length > 20 ? 'Active' :
                                 userActivity.length > 5 ? 'Getting Started' : 'New';
            document.getElementById('communityRank').textContent = activityLevel;
        }

        // Track user activity
        async function trackActivity(activityType, contentType, contentId, metadata = {}) {
            try {
                await supabase.rpc('track_user_activity', {
                    p_user_id: currentUser.id,
                    p_activity_type: activityType,
                    p_content_type: contentType,
                    p_content_id: contentId,
                    p_metadata: metadata
                });
            } catch (error) {
                console.error('Error tracking activity:', error);
            }
        }

        // Utility functions
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        function getActivityIcon(type) {
            const icons = {
                view: 'fa-eye',
                click: 'fa-mouse-pointer',
                search: 'fa-search',
                favorite: 'fa-heart',
                create: 'fa-plus',
                share: 'fa-share',
                comment: 'fa-comment',
                download: 'fa-download'
            };
            return icons[type] || 'fa-circle';
        }

        function getActivityText(activity) {
            const actions = {
                view: 'Viewed',
                click: 'Clicked on',
                search: 'Searched for',
                favorite: 'Favorited',
                create: 'Created',
                share: 'Shared',
                comment: 'Commented on',
                download: 'Downloaded'
            };
            const action = actions[activity.activity_type] || activity.activity_type;
            return `${action} a ${activity.content_type}`;
        }

        function getContentIcon(type) {
            const icons = {
                project: 'fa-leaf',
                resource: 'fa-box',
                wiki_guide: 'fa-book',
                event: 'fa-calendar',
                user_profile: 'fa-user'
            };
            return icons[type] || 'fa-file';
        }

        // Navigation functions
        window.viewContent = function(type, id) {
            trackActivity('click', type, id);
            // Navigate based on content type
            switch(type) {
                case 'project':
                    window.location.href = `project.html?id=${id}`;
                    break;
                case 'resource':
                    window.location.href = `resources.html?id=${id}`;
                    break;
                case 'wiki_guide':
                    window.location.href = `wiki.html?guide=${id}`;
                    break;
            }
        };

        window.viewProject = function(id) {
            trackActivity('click', 'project', id);
            window.location.href = `project.html?id=${id}`;
        };

        window.viewResource = function(id) {
            trackActivity('click', 'resource', id);
            window.location.href = `resources.html?id=${id}`;
        };

        window.viewWikiGuide = function(slug) {
            trackActivity('click', 'wiki_guide', null, { slug });
            window.location.href = `wiki.html?guide=${slug}`;
        };

        window.exploreCategory = function(categoryId) {
            trackActivity('click', 'category_page', categoryId);
            window.location.href = `resources.html?category=${categoryId}`;
        };

        // Dashboard management functions
        window.toggleCustomization = function() {
            const panel = document.getElementById('customizationPanel');
            panel.classList.toggle('open');
        };

        window.refreshDashboard = async function() {
            await initDashboard();
        };

        window.viewProfile = function() {
            window.location.href = 'profile.html';
        };

        window.refreshWidget = async function(widgetKey) {
            const definition = widgetDefinitions[widgetKey];
            if (definition) {
                await definition.render(widgetKey);
            }
        };

        window.toggleWidget = function(widgetKey) {
            const content = document.getElementById(`widget-content-${widgetKey}`);
            const isExpanded = content.style.display !== 'none';
            content.style.display = isExpanded ? 'none' : 'block';

            // Update config
            if (dashboardConfig.widgets[widgetKey]) {
                dashboardConfig.widgets[widgetKey].expanded = !isExpanded;
                saveDashboardConfig();
            }
        };

        // Populate customization panel
        function populateCustomizationPanel() {
            const container = document.getElementById('widgetToggles');
            container.innerHTML = '';

            Object.entries(widgetDefinitions).forEach(([key, definition]) => {
                const isVisible = dashboardConfig.widgets[key]?.visible !== false;
                const toggle = document.createElement('div');
                toggle.className = 'widget-toggle';
                toggle.innerHTML = `
                    <span>${definition.title}</span>
                    <div class="toggle-switch ${isVisible ? 'active' : ''}"
                         onclick="toggleWidgetVisibility('${key}', this)"></div>
                `;
                container.appendChild(toggle);
            });
        }

        window.toggleWidgetVisibility = async function(widgetKey, element) {
            element.classList.toggle('active');
            const isVisible = element.classList.contains('active');

            // Update config
            if (!dashboardConfig.widgets[widgetKey]) {
                dashboardConfig.widgets[widgetKey] = {};
            }
            dashboardConfig.widgets[widgetKey].visible = isVisible;

            await saveDashboardConfig();
            await loadDashboardWidgets();
        };

        window.updateDensity = async function(density) {
            dashboardConfig.content_density = density;
            await saveDashboardConfig();
            // Apply density styles
            document.body.className = `density-${density}`;
        };

        window.updateTheme = async function(theme) {
            dashboardConfig.theme_preference = theme;
            await saveDashboardConfig();
            // Apply theme (would need more implementation)
        };

        // Save dashboard configuration
        async function saveDashboardConfig() {
            try {
                await supabase
                    .from('user_dashboard_config')
                    .update({
                        widgets: dashboardConfig.widgets,
                        content_density: dashboardConfig.content_density,
                        theme_preference: dashboardConfig.theme_preference,
                        updated_at: new Date().toISOString()
                    })
                    .eq('user_id', currentUser.id);
            } catch (error) {
                console.error('Error saving dashboard config:', error);
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
